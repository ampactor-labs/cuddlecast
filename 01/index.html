<title>CUDDLECAST №01</title>
<style>
  @font-face { font-family: Anton; font-display: swap; src: url(../fonts/anton.woff) format('woff'); }
  @font-face { font-family: 'Space Mono'; font-display: swap; src: url(../fonts/spacemono.woff) format('woff'); }
  :root { --void: #0a0a0a; --bone: #e2d6c8; --chrome: #c0c0c0; --aster: #773fa8; --verbena: #907ecf; }

  .label { font-family: 'Space Mono', 'Courier New', monospace; text-transform: uppercase; letter-spacing: .3em;
    color: var(--verbena); font-size: .78rem; line-height: 1.8; margin: 0 0 2rem; }
  p { line-height: 1.5; font-size: 1.05rem; margin: 0 0 1.2rem; max-width: 65ch; }
